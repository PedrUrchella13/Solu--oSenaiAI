<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

{% include 'partials/header.html' %}

<div class="min-h-screen flex items-center justify-center">

    <form method="POST"
          class="bg-white p-10 rounded-xl shadow-xl w-full max-w-lg">

        <h2 class="text-3xl font-bold text-center mb-8 text-red-600">
            Cadastro
        </h2>

        <input type="text"
               name="nome"
               placeholder="Nome completo"
               required
               class="w-full border p-3 rounded mb-4">

        <input type="email"
               name="email"
               placeholder="E-mail"
               required
               class="w-full border p-3 rounded mb-4">

        <input type="password"
               name="senha"
               placeholder="Senha"
               required
               class="w-full border p-3 rounded mb-4">

        <select name="tipo"
                class="w-full border p-3 rounded mb-6">

            <option value="aluno">
                Aluno
            </option>

            <option value="gestor">
                Gestor
            </option>

        </select>

        <button class="w-full bg-red-600 text-white py-3 rounded hover:bg-red-700">
            Cadastrar
        </button>

    </form>

</div>

</body>
</html>
