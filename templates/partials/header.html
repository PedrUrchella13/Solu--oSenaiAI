<header class="bg-black text-white shadow-lg">

    <div class="container mx-auto flex flex-col md:flex-row justify-between items-center p-4 gap-4">

        <!-- LOGO -->
        <div class="flex items-center gap-3">

            <img
                src="{{ url_for('static', filename='uploads/' + session.get('usuario_foto', 'default.png')) }}"
                class="w-12 h-12 rounded-full border-2 border-red-600 object-cover"
            >

            <div>
                <h1 class="text-xl font-bold text-red-500">
                    Senai Jaú
                </h1>

                {% if session.get('usuario_nome') %}
                    <p class="text-sm">
                        {{ session['usuario_nome'] }}
                    </p>
                {% endif %}
            </div>
        </div>

        <!-- MENU -->
        <nav class="flex flex-wrap gap-3 items-center">

            <a href="/" class="hover:text-red-500 transition">
                Início
            </a>

            <a href="/cursos" class="hover:text-red-500 transition">
                Cursos
            </a>

            {% if session.get('usuario_id') %}

                <a href="/dashboard" class="hover:text-red-500">
                    Dashboard
                </a>

                <a href="/perfil" class="hover:text-red-500">
                    Perfil
                </a>

                {% if session.get('usuario_tipo') == 'gestor' %}
                    <a href="/admin" class="hover:text-red-500">
                        Administração
                    </a>
                {% endif %}

                <a href="/logout"
                   class="bg-red-600 px-4 py-2 rounded hover:bg-red-700">
                    Sair
                </a>

            {% else %}

                <a href="/login"
                   class="bg-red-600 px-4 py-2 rounded hover:bg-red-700">
                    Login
                </a>

            {% endif %}

        </nav>
    </div>
</header>
