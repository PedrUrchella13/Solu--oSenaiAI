<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

{% include 'partials/header.html' %}

<div class="container mx-auto py-10">

    <div class="bg-white rounded-xl shadow-lg p-10 max-w-xl mx-auto">

        <h1 class="text-3xl font-bold text-red-600 mb-6">
            Meu Perfil
        </h1>

        <img
            src="{{ url_for('static', filename='uploads/' + usuario['foto']) }}"
            class="w-32 h-32 rounded-full object-cover mb-6 border-4 border-red-600"
        >

        <form method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="foto"
                   class="mb-6">

            <button class="bg-red-600 text-white px-6 py-3 rounded hover:bg-red-700">
                Atualizar Foto
            </button>

        </form>

    </div>

</div>

</body>
</html>
